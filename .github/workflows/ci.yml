# Runs on every push / PR: backend API tests on a real MySQL 8, React tests + build,
# and Flutter analyze + tests. (Merge with any workflow you already have in .github/.)
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: react_game/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generated content is up to date
        run: npm run content && git diff --exit-code ../backend/database/seed.sql ../flutter_game/lib/data/seed.g.dart

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_game
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --project-name type_to_run --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=API_URL=/api
